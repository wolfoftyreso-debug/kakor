# CI: kvalitetsgrind före merge/deploy. Deployment sköts av Vercels
# Git-integration — den dupliceras medvetet INTE här.
# Testerna startar en inbäddad PostgreSQL (samma motor som Neon).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Varning, inte grind: transitiva sårbarheter i byggverktyg ska synas
      # utan att blockera en deploy som annars är grön.
      - run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit hittade sårbarheter — se loggen"
